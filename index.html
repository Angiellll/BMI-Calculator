<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人健康 Management 工具 - BMI 專業顧問</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // ── 步驟 3: LIFF 與 後端 設定 ──────────────────────
        const LIFF_ID = "2009839664-oAxbK6nF"; // 改成你的 LIFF ID
        const BACKEND_URL = "https://angie-bmi-bot.onrender.com"; // 改成你的後端網址 (例如 Railway 給的)
        let lineUserId = null;

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    lineUserId = profile.userId;
                    console.log("LIFF 已登入，User ID:", lineUserId);
                } else {
                    console.log("LIFF 未登入");
                }
            } catch (e) {
                console.log("非 LINE 環境或 LIFF 初始化失敗:", e);
            }
        }
    </script>

    <style>
        /* 你原本的所有 CSS 樣式保持不變 */
        :root {
            --primary: #4a90e2; --success: #2ecc71; --warning: #f1c40f; --danger: #e74c3c;
            --outdoor: #3498db; --home: #9b59b6; --history: #34495e; --target: #e67e22;
            --gain: #e67e22; --lose: #e74c3c; --bg: #f0f4f8; --card: #ffffff;
            --text: #1a1a2e; --muted: #6b7280; --border: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; line-height: 1.6; color: var(--text); }
        .container { background: var(--card); padding: 2rem; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 560px; }
        h1 { text-align: center; font-weight: 900; font-size: 1.5rem; color: var(--text); margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.4rem; color: #555; font-weight: 700; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; font-family: inherit; transition: border-color 0.2s; background: #fafafa; }
        input:focus, select:focus { border-color: var(--primary); outline: none; background: #fff; }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 700; font-family: inherit; margin-top: 10px; transition: transform 0.15s, box-shadow 0.15s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74,144,226,0.3); }
        #result-section { margin-top: 2rem; display: none; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .status-header { text-align: center; padding: 1.2rem; background: #f8f9fa; border-radius: 14px; margin-bottom: 1rem; border-top: 5px solid var(--primary); }
        .bmi-number { font-size: 3.2rem; font-weight: 900; display: block; font-family: 'DM Mono', monospace; }
        .advice-card { background: #fff; padding: 1.2rem; margin-top: 1rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: all 0.2s; }
        .card-title { font-weight: 700; display: flex; align-items: center; margin-bottom: 8px; font-size: 1rem; color: var(--text); }
        .click-hint { font-size: 0.75rem; font-weight: 400; margin-left: auto; color: var(--primary); cursor: pointer; }
        .progress-container { background: #eee; border-radius: 20px; height: 24px; margin: 12px 0; position: relative; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, var(--success), #58d68d); height: 100%; width: 0%; transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }
        .progress-text { position: absolute; right: 10px; top: 0; font-size: 0.8rem; line-height: 24px; color: #333; font-weight: 700; }
        .history-card { border-left: 5px solid var(--history); }
        .chart-container { width: 100%; height: 200px; margin-top: 10px; }
        .clickable-card:hover { transform: scale(1.015); box-shadow: 0 6px 18px rgba(0,0,0,0.07); cursor: pointer; }
        .diet-card { border-left: 5px solid var(--success); }
        .outdoor-card { border-left: 5px solid var(--outdoor); }
        .home-card { border-left: 5px solid var(--home); }
        .target-progress-card { border-left: 5px solid var(--target); }
        .action-btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-gain { background: linear-gradient(135deg, #e67e22, #d35400); flex: 1; padding: 13px; margin-top: 0; border-radius: 10px; font-size: 0.95rem; color: #fff; }
        .btn-lose { background: linear-gradient(135deg, #e74c3c, #c0392b); flex: 1; padding: 13px; margin-top: 0; border-radius: 10px; font-size: 0.95rem; color: #fff; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); }
        .modal-content { background: white; margin: 4% auto; padding: 28px; border-radius: 20px; width: 90%; max-width: 500px; position: relative; animation: slideDown 0.3s ease; max-height: 88vh; overflow-y: auto; }
        .challenge-modal-content { max-width: 540px; padding: 0; overflow-y: auto; max-height: 88vh; }
        .challenge-hero { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); padding: 28px 28px 20px; position: relative; overflow: hidden; }
        .challenge-hero-title { font-size: 1.3rem; font-weight: 900; color: #fff; margin-bottom: 4px; position: relative; }
        .challenge-hero-sub { color: rgba(255,255,255,0.6); font-size: 0.85rem; position: relative; }
        .challenge-close { position: absolute; right: 18px; top: 18px; color: rgba(255,255,255,0.6); font-size: 24px; cursor: pointer; z-index: 10; }
        .challenge-overview { display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.08); border-radius: 14px; padding: 14px 18px; margin-top: 18px; position: relative; }
        .avatar-display { font-size: 2.8rem; flex-shrink: 0; }
        .overview-info { flex: 1; }
        .overview-label { color: rgba(255,255,255,0.5); font-size: 0.75rem; }
        .overview-value { color: #fff; font-weight: 700; font-size: 1rem; }
        .overview-streak { background: linear-gradient(135deg, var(--warning), #f39c12); color: #000; font-weight: 900; font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; }
        .challenge-body { padding: 20px 24px 24px; }
        .section-label { font-size: 0.75rem; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-bottom: 20px; }
        .cal-day { aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; border: 1.5px solid var(--border); background: #fafafa; color: var(--muted); }
        .cal-day.done { background: linear-gradient(135deg, #2ecc71, #27ae60); border-color: #27ae60; color: white; }
        .week-badge { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, var(--primary), #357abd); color: white; font-size: 0.75rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; margin-bottom: 12px; }
        .task-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
        .task-item { display: flex; align-items: center; gap: 12px; background: #f8f9fa; border-radius: 10px; padding: 12px 14px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .task-item.checked { background: #f0fdf4; border-color: var(--success); }
        .task-checkbox { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ccc; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .complete-btn { width: 100%; padding: 15px; border-radius: 12px; font-size: 1rem; font-weight: 700; border: none; cursor: pointer; margin-top: 0; transition: all 0.2s; }
        .complete-btn.locked { background: var(--border); color: var(--muted); cursor: not-allowed; }
        .complete-btn.ready { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
        .line-link { margin-top: 1rem; padding: 1rem; background: #e8f4fd; border-radius: 10px; text-align: center; border: 1px dashed var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1>🌿 健康管理顧問</h1>
    <div style="display: flex; gap: 10px;">
        <div class="input-group" style="flex: 1;">
            <label for="height">身高 (cm)</label>
            <input type="number" id="height" placeholder="例如: 175" step="0.1">
        </div>
        <div class="input-group" style="flex: 1;">
            <label for="weight">體重 (kg)</label>
            <input type="number" id="weight" placeholder="例如: 70" step="0.1">
        </div>
    </div>
    <div class="input-group">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 400;">
            <input type="checkbox" id="enableTarget" onchange="toggleTargetInput()" style="width: auto;">
            設定目標體重 <span style="font-size: 0.8rem; color: var(--target);">(開啟進度追蹤)</span>
        </label>
        <input type="number" id="targetWeight" placeholder="請先勾選上方方塊" step="0.1" disabled style="margin-top: 8px;">
    </div>
    <button onclick="calculateBMI()">生成完整健康報告</button>

    
    <div id="result-section">
        <div class="status-header" id="status-box">
            <span class="bmi-number" id="bmi-value">--</span>
            <p>您的健康狀態：<strong id="bmi-status">--</strong></p>
        </div>
        <div id="advice-container"></div>
        <div class="line-link">
            <p style="margin: 0; font-size: 0.88rem; color: #555;">需要 AI 隨身提醒運動嗎？</p>
            <a href="https://line.me/R/ti/p/@711iezfo" style="color: var(--primary); font-weight: 700; text-decoration: none;">打開 LINE AI 顧問 ➔</a>
        </div>
    </div>
</div>

<div id="challengeModal" class="modal">
    <div class="modal-content challenge-modal-content">
        <div class="challenge-hero">
            <span class="challenge-close" onclick="closeModal('challengeModal')">×</span>
            <div class="challenge-hero-title" id="challenge-hero-title">💪 30天挑戰</div>
            <div class="challenge-hero-sub" id="challenge-hero-sub">建立習慣，改變體態</div>
            <div class="challenge-overview">
                <div class="avatar-display" id="ch-avatar">🧍</div>
                <div class="overview-info">
                    <div class="overview-label">目前階段</div>
                    <div class="overview-value" id="ch-stage">新手上路</div>
                    <div class="overview-label" style="margin-top:6px;">連續打卡</div>
                    <div class="overview-value" id="ch-streak">0 天</div>
                </div>
                <div><div class="overview-streak" id="ch-day-badge">DAY 1</div></div>
            </div>
        </div>
        <div class="challenge-body">
            <div class="section-label">📅 打卡進度</div>
            <div class="calendar-grid" id="ch-calendar"></div>
            <div style="margin-top: 18px;">
                <div class="week-badge"><span id="ch-week-label">第一週</span> · 今日任務</div>
                <div class="task-list" id="ch-task-list"></div>
                <button class="complete-btn locked" id="ch-complete-btn" onclick="completeDayChallenge()">
                    尚有任務未完成
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// ── 步驟 2+3: 資料庫與同步邏輯 ──────────────────────────────────────────────
const STORAGE_KEY = 'bmi_challenge_v2';
const challengePlans = {
    gain: {
        title: "💪 30天增肌增重挑戰", sub: "科學化增重，打造強壯體態",
        avatars: ["🧍","💪","🏋️","🦍"], stages: ["新手上路","基礎建立","強化衝刺","終極挑戰者"],
        weekLabels: ["第一週：基礎適應","第二週：肌力建構","第三週：負荷強化","第四週：成果驗收"],
        weeks: [
            ["早餐增加一份蛋白質（如雞蛋、豆漿）", "訓練：做 3 組深蹲，每組 12 下", "睡前喝一杯溫牛奶補充熱量"],
            ["每餐加入手掌大小的蛋白質來源", "訓練：伏地挺身 + 弓箭步各 4 組", "記錄今日的訓練負重數字"],
            ["進行力竭訓練，每組做到撐不住為止", "增加一餐高碳水的點心（如香蕉、地瓜）", "睡前做 5 分鐘靜態伸展放鬆"],
            ["用最重的重量完成一次完整訓練", "測量體重並與第一天比較", "今天好好犒賞自己，充足休息"]
        ]
    },
    lose: {
        title: "🔥 30天燃脂瘦身挑戰", sub: "健康減脂，不節食不挨餓",
        avatars: ["🍕","🥗","🏃","✨"], stages: ["準備出發","習慣改變","燃脂爆發","脫胎換骨"],
        weekLabels: ["第一週：代謝喚醒","第二週：主動燃脂","第三週：體能突破","第四週：體質鞏固"],
        weeks: [
            ["今天喝 2000ml 以上的水", "戒除一杯含糖飲料，改喝無糖飲品", "餐前 10 分鐘先喝一杯水再吃飯"],
            ["今天做 20 分鐘有氧運動（快走/跳繩）", "晚餐吃五分飽，減少精緻澱粉", "記錄今日吃了哪些讓你後悔的食物"],
            ["完成一次 HIIT 訓練（20 分鐘）", "晚餐不吃白飯，改為地瓜或糙米", "睡覺前不吃任何東西"],
            ["測量體重並與第一天比較", "制定下個月的維持計畫", "今天好好犒賞自己（健康的方式）"]
        ]
    }
};

function getChallengeState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
}
function saveChallengeState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function todayKey() { return new Date().toISOString().slice(0, 10); }

async function completeDayChallenge() {
    const state = getChallengeState();
    const today = todayKey();
    if (!state || state.completedDays.includes(today)) return;

    const weekIndex = Math.min(Math.floor(state.completedDays.length / 7), 3);
    const checks = state.taskChecks[today] || [];
    const allDone = checks.every(c => c) && checks.length > 0;
    if (!allDone) return;

    state.completedDays.push(today);
    saveChallengeState(state);

    // ★ 打卡後同步到後端
    if (lineUserId) {
        try {
            await fetch(`${BACKEND_URL}/sync_challenge`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: lineUserId,
                    challengeData: state
                })
            });
            console.log("同步成功");
        } catch (e) {
            console.warn("同步失敗，僅存本地:", e);
        }
    }

    // 原有邏輯不動
    confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });
    const newCount = state.completedDays.length;
    const milestones = [7, 14, 21, 30];
    if (milestones.includes(newCount)) {
        setTimeout(() => {
            confetti({ particleCount: 200, spread: 120, origin: { y: 0.4 } });
            alert(`🏆 恭喜達成「${newCount} 天」里程碑！`);
        }, 600);
    }
    setTimeout(() => renderChallengeModal(state), 400);
}

// 渲染挑戰介面 (簡化版邏輯)
function renderChallengeModal(state) {
    const plan = challengePlans[state.type];
    const completedCount = state.completedDays.length;
    const weekIndex = Math.min(Math.floor(completedCount / 7), 3);
    const today = todayKey();

    document.getElementById('challenge-hero-title').innerText = plan.title;
    document.getElementById('ch-avatar').innerText = plan.avatars[weekIndex];
    document.getElementById('ch-week-label').innerText = plan.weekLabels[weekIndex];
    
    // 渲染任務列表
    const tasks = plan.weeks[weekIndex];
    const checks = state.taskChecks[today] || new Array(tasks.length).fill(false);
    state.taskChecks[today] = checks;

    const listEl = document.getElementById('ch-task-list');
    listEl.innerHTML = '';
    tasks.forEach((t, i) => {
        const item = document.createElement('div');
        item.className = `task-item ${checks[i] ? 'checked' : ''}`;
        item.innerHTML = `<div class="task-checkbox">${checks[i] ? '✓' : ''}</div><div class="task-text">${t}</div>`;
        item.onclick = () => {
            if (state.completedDays.includes(today)) return;
            checks[i] = !checks[i];
            saveChallengeState(state);
            renderChallengeModal(state);
        };
        listEl.appendChild(item);
    });

    const btn = document.getElementById('ch-complete-btn');
    if (state.completedDays.includes(today)) {
        btn.innerText = "今日已打卡"; btn.className = "complete-btn locked";
    } else if (checks.every(c => c)) {
        btn.innerText = "完成今日挑戰"; btn.className = "complete-btn ready";
    } else {
        btn.innerText = "尚有任務未完成"; btn.className = "complete-btn locked";
    }
}

// 基礎 BMI 計算 (原邏輯)
function calculateBMI() {
    const h = parseFloat(document.getElementById('height').value);
    const w = parseFloat(document.getElementById('weight').value);
    if (!h || !w) return alert("請輸入身高體重");
    const bmi = (w / ((h / 100) ** 2)).toFixed(1);
    document.getElementById('bmi-value').innerText = bmi;
    document.getElementById('bmi-status').innerText = bmi < 18.5 ? "體重過輕" : (bmi < 24 ? "正常" : "過重");
    document.getElementById('result-section').style.display = 'block';
    
    // 顯示按鈕區
    const status = bmi < 18.5 ? "體重過輕" : (bmi < 24 ? "正常" : "過重");
    const container = document.getElementById('advice-container');
    container.innerHTML = `
        <div class="action-btn-group">
            <button class="btn-gain" onclick="startChallenge('gain', '${status}')">增肌挑戰</button>
            <button class="btn-lose" onclick="startChallenge('lose', '${status}')">減脂挑戰</button>
        </div>
    `;
}

function startChallenge(type, status) {
    let state = getChallengeState();
    if (!state || state.type !== type) {
        state = { type: type, startDate: todayKey(), completedDays: [], taskChecks: {} };
        saveChallengeState(state);
    }
    renderChallengeModal(state);
    document.getElementById('challengeModal').style.display = 'block';
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function toggleTargetInput() {
    const input = document.getElementById('targetWeight');
    input.disabled = !document.getElementById('enableTarget').checked;
}

// ── 步驟 3: 網頁載入初始化 ──
window.addEventListener('load', async function() {
    await initLiff();  // ★ 加在最開頭

    // 以下原本的 URL 參數解析邏輯完全不動
    const urlParams = new URLSearchParams(window.location.search);
    const h = urlParams.get('h'), w = urlParams.get('w'), t = urlParams.get('t');
    if (h && w) {
        document.getElementById('height').value = h;
        document.getElementById('weight').value = w;
        const tCheck = document.getElementById('enableTarget');
        const tInput = document.getElementById('targetWeight');
        if (t && tCheck && tInput) {
            tCheck.checked = true; tInput.disabled = false; tInput.value = t;
        } else if (tCheck) {
            tCheck.checked = false; if (tInput) tInput.disabled = true;
        }
        setTimeout(() => { if (typeof calculateBMI === "function") calculateBMI(); }, 400);
    }
});
</script>
</body>
</html>
